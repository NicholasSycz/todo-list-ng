<form (ngSubmit)="onSubmit()" class="group py-5">
  <div class="flex items-start justify-between gap-4">
    <div class="flex min-w-0 flex-1 items-start gap-3">
      <span class="mt-2 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border border-amber-900/30 text-amber-900/30">
      </span>

      <div class="min-w-0 flex-1">
        <input
          id="title"
          [(ngModel)]="title"
          name="title"
          placeholder="New outlaw..."
          autocomplete="off"
          class="w-full bg-transparent font-['Cedarville_Cursive'] text-2xl font-bold tracking-tight text-stone-950 outline-none placeholder:text-stone-400/40"
        />

        <textarea
          id="note"
          [(ngModel)]="note"
          name="note"
          placeholder="Last seen, crimes committed..."
          rows="2"
          class="mt-1 w-full resize-none bg-transparent font-['Cedarville_Cursive'] text-lg leading-6 text-stone-600 outline-none placeholder:text-stone-400/40"
        ></textarea>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="!title"
      class="mt-1 shrink-0 border-b border-red-950/40 pb-0.5 font-['Sancreek'] text-xs uppercase tracking-[0.18em] text-red-950 opacity-40 transition hover:border-red-800 hover:text-red-800 hover:opacity-100 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-20"
    >
      Post
    </button>
  </div>
</form>
