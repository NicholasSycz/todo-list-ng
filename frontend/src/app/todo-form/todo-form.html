<div>
  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div>
      <label
        for="title"
        class="mb-1 block font-['Sancreek'] text-sm uppercase tracking-[0.18em] text-amber-900"
      >
        Todo title
      </label>

      <input
        id="title"
        [(ngModel)]="title"
        name="title"
        placeholder="Example: Study Angular"
        required
        class="w-full border-0 border-b border-amber-900/30 bg-transparent px-1 py-2 font-['Cormorant_Garamond'] text-2xl font-semibold text-stone-950 outline-none transition placeholder:text-stone-500/60 focus:border-red-950 focus:ring-0"
      />
    </div>

    <div>
      <label
        for="note"
        class="mb-1 block font-['Sancreek'] text-sm uppercase tracking-[0.18em] text-amber-900"
      >
        Note
        <span class="font-sans text-xs font-normal normal-case tracking-normal text-stone-500">
          optional
        </span>
      </label>

      <textarea
        id="note"
        [(ngModel)]="note"
        name="note"
        placeholder="Add extra details if needed..."
        rows="3"
        class="w-full resize-none border-0 border-b border-amber-900/30 bg-transparent px-1 py-2 font-['Cormorant_Garamond'] text-xl leading-7 text-stone-800 outline-none transition placeholder:text-stone-500/60 focus:border-red-950 focus:ring-0"
      ></textarea>
    </div>

    <div class="flex justify-end">
      <button
        type="submit"
        class="border-b border-red-950/40 pb-0.5 font-['Sancreek'] text-sm uppercase tracking-[0.18em] text-red-950 transition hover:border-red-800 hover:text-red-800 active:scale-[0.98]"
      >
        Add Todo
      </button>
    </div>
  </form>
</div>
